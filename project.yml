name: Kafelek
options:
  bundleIdPrefix: pl.amadeo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: pl

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Podpis lokalny („Sign to Run Locally”): bez konta Apple, bez profili, nic nie wygasa.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Kafelek:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kafelek
        CFBundleName: Kafelek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: Kafelek – twoje widżety na pulpit
        NSCalendarsUsageDescription: Kafelek pokazuje wydarzenia z Kalendarza w Twoich widżetach.
        NSCalendarsFullAccessUsageDescription: Kafelek pokazuje wydarzenia z Kalendarza w Twoich widżetach.
        NSRemindersUsageDescription: Kafelek pokazuje i odhacza Twoje Przypomnienia w widżetach.
        NSRemindersFullAccessUsageDescription: Kafelek pokazuje i odhacza Twoje Przypomnienia w widżetach.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.amadeo.kafelek
        PRODUCT_NAME: Kafelek
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: KafelekWidget
        embed: true
        codeSign: true

  KafelekWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kafelek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widget/KafelekWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Widżet czyta projekty i zdjęcia prosto z folderu aplikacji (działa nawet gdy Kafelek jest wyłączony).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - "/Library/Application Support/Kafelek/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.amadeo.kafelek.widget
        PRODUCT_NAME: KafelekWidget
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

schemes:
  Kafelek:
    build:
      targets:
        Kafelek: all
        KafelekWidget: all
    run:
      config: Debug
    archive:
      config: Release
